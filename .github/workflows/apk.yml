name: Fabriquer l'APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Recuperer le code du Snack (derniere version enregistree)
        run: |
          mkdir app && cd app
          curl -sSf -H "Snack-Api-Version: 3.0.0" "https://exp.host/--/api/v2/snack/@lonis57/cap-infirmier" -o snack.json
          node -e "
          const fs = require('fs'); const path = require('path');
          const s = JSON.parse(fs.readFileSync('snack.json', 'utf8'));
          for (const [f, v] of Object.entries(s.code)) {
            if (f === 'package.json' || f === 'eas.json' || v.type === 'ASSET' || !v.contents) continue;
            fs.mkdirSync(path.dirname(f), { recursive: true });
            fs.writeFileSync(f, v.contents);
          }
          fs.writeFileSync('package.json', JSON.stringify({ name: 'cap-infirmier', version: '1.3.0', private: true, main: 'apk-entry.js', dependencies: { expo: '~55.0.0', react: '19.2.0', 'react-native': '0.83.10', 'expo-status-bar': '~55.0.6', '@react-native-async-storage/async-storage': '2.2.0', 'expo-notifications': '~55.0.27', 'expo-constants': '~55.0.17' } }, null, 2));
          console.log(fs.readdirSync('.'));
          "
      - name: Installer les dependances
        working-directory: app
        run: |
          echo "legacy-peer-deps=true" > .npmrc
          npm install
          npx expo install --fix || true
          npm ls react react-native expo || true
      - name: Generer l'icone
        working-directory: app
        run: node ../repo/extras/mkicon.js
      - name: Preparer le projet Android
        working-directory: app
        run: CI=1 npx expo prebuild --platform android
      - name: Compiler l'APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Mettre l'APK a disposition
        uses: actions/upload-artifact@v4
        with:
          name: CAP-Infirmier-APK
          path: app/android/app/build/outputs/apk/release/app-release.apk
      - name: Publier le lien de telechargement direct
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk CAP-Infirmier.apk
          gh release delete apk --yes --cleanup-tag -R ${{ github.repository }} || true
          gh release create apk CAP-Infirmier.apk -R ${{ github.repository }} --title "CAP Infirmier pour Android" --notes "Derniere version de l'application Android CAP Infirmier." --latest
